<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nautylus</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f4f6f8;
      --panel: #ffffff;
      --line: #dfe4ea;
      --text: #263238;
      --muted: #68757f;
      --control: #ffffff;
      --control-border: #c8d0d8;
      --control-hover: #f7f9fb;
      --input-border: #cbd5e1;
      --subtle: #eef2f5;
      --table-line: #edf0f2;
      --label-bg: #ffffff;
      --label-border: #e4e8ec;
      --label-text: #5d6870;
      --relationship: #a5abb6;
      --relationship-selected: #37474f;
      --selection: #1f6feb;
      --accent: #3771c8ff;
      --shadow: 0 12px 30px rgba(27, 39, 51, .08);
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --page: #111820;
      --panel: #18222d;
      --line: #2d3a48;
      --text: #e6edf3;
      --muted: #9ba9b7;
      --control: #1d2935;
      --control-border: #405061;
      --control-hover: #263646;
      --input-border: #405061;
      --subtle: #263442;
      --table-line: #2b3947;
      --label-bg: #202d39;
      --label-border: #405061;
      --label-text: #b8c4cf;
      --relationship: #8493a3;
      --relationship-selected: #d5e1ed;
      --selection: #6fa8ff;
      --shadow: 0 12px 30px rgba(0, 0, 0, .24);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--page);
    }

    body { min-height: 100vh; }

    button {
      appearance: none;
      border: 1px solid var(--control-border);
      background: var(--control);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 12px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      font-weight: 700;
    }

    button:hover { background: var(--control-hover); }
    button.primary:hover { background: #2f63ad; }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(31, 111, 235, .25);
      outline-offset: 2px;
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--input-border);
      border-radius: 8px;
      background: var(--control);
      color: var(--text);
      font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    textarea {
      min-height: 96px;
      padding: 10px;
      resize: vertical;
    }

    .app-shell {
      width: min(1560px, calc(100% - 28px));
      margin: 14px auto;
    }

    .topbar {
      display: grid;
      grid-template-columns: auto minmax(260px, 1fr) auto auto;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .brand img {
      width: 64px;
      height: 56px;
      object-fit: contain;
      filter: drop-shadow(0 3px 5px rgba(55, 113, 200, .2));
    }

    .query-bar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      align-items: start;
      gap: 8px;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--control);
      box-shadow: var(--shadow);
      padding: 7px;
    }

    .query-prompt {
      position: relative;
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font: 800 16px ui-monospace, SFMono-Regular, Menlo, monospace;
      box-shadow: 0 0 0 3px rgba(55, 113, 200, .12), 0 3px 8px rgba(55, 113, 200, .22);
    }

    .query-prompt::after {
      content: "";
      position: absolute;
      right: 5px;
      bottom: 5px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #fff;
      opacity: .8;
    }

    #query {
      min-height: 34px;
      max-height: 140px;
      padding: 7px 2px;
      border: 0;
      border-radius: 0;
      resize: none;
      overflow-y: auto;
      line-height: 20px;
    }

    .status {
      justify-self: end;
      max-width: 300px;
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 12px;
      height: calc(100vh - 80px);
      min-height: 560px;
    }

    .graph, .inspector, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .graph {
      position: relative;
      cursor: grab;
    }

    .graph svg {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    .graph svg:active { cursor: grabbing; }

    .graph-toolbar {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 3;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .graph-toolbar button {
      background: color-mix(in srgb, var(--control) 92%, transparent);
      backdrop-filter: blur(8px);
    }

    .inspector {
      padding: 18px;
      overflow: auto;
    }

    .inspector h2, .panel h2 {
      margin: 0 0 8px;
      font-size: 15px;
    }

    .inspector h3 {
      margin: 16px 0 8px;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .inspector p { margin: 5px 0; font-size: 13px; line-height: 1.45; }
    .hint { color: var(--muted); }

    .details {
      display: grid;
      grid-template-columns: 1fr;
      margin-top: 12px;
    }

    .panel { padding: 14px; }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    input { min-height: 36px; padding: 9px; }
    input[type="color"] { padding: 3px; }

    pre {
      min-height: 96px;
      max-height: 220px;
      margin: 8px 0 0;
      padding: 12px;
      overflow: auto;
      border-radius: 8px;
      background: #101820;
      color: #e2e8f0;
      white-space: pre-wrap;
      font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .property-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 12px;
    }

    .property-table th, .property-table td {
      padding: 7px 0;
      border-bottom: 1px solid var(--table-line);
      vertical-align: top;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .property-table th {
      width: 40%;
      color: var(--muted);
      font-weight: 500;
      padding-right: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--subtle);
      font-size: 11px;
      font-weight: 700;
    }

    .color-editor {
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 8px;
      align-items: center;
      margin: 8px 0 4px;
    }

    .color-editor input[type="color"] {
      width: 44px;
      height: 34px;
      min-height: 34px;
      padding: 3px;
    }

    .color-editor .row { margin-top: 0; }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .check-row input { accent-color: var(--accent); }

    .relationship-path {
      fill: none;
      stroke: var(--relationship);
      stroke-width: 2.2;
      vector-effect: non-scaling-stroke;
      cursor: pointer;
    }

    .relationship-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 16;
      vector-effect: non-scaling-stroke;
      cursor: pointer;
    }

    .relationship.selected .relationship-path { stroke: var(--relationship-selected); stroke-width: 3; }
    .relationship.dimmed { opacity: .42; }

    .relationship-label-bg {
      fill: var(--label-bg);
      stroke: var(--label-border);
      stroke-width: 1;
      rx: 3;
      ry: 3;
      pointer-events: none;
    }

    .relationship-label {
      fill: var(--label-text);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .035em;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      user-select: none;
    }

    .node { cursor: pointer; }
    .node.dimmed { opacity: .72; }

    .node-ring {
      fill: var(--panel);
      stroke: transparent;
      stroke-width: 4;
    }

    .node.selected .node-ring { stroke: var(--selection); }

    .node-circle {
      stroke-width: 2.5;
      filter: drop-shadow(0 2px 2px rgba(30, 41, 59, .14));
    }

    .node-label {
      fill: #fff;
      font-size: 11px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      user-select: none;
    }

    .node-sublabel {
      fill: color-mix(in srgb, var(--panel) 88%, transparent);
      font-size: 8px;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      user-select: none;
    }

    .pin-dot {
      fill: var(--panel);
      stroke: var(--text);
      stroke-width: 1.5;
      pointer-events: none;
    }

    .theme-toggle {
      width: 40px;
      height: 40px;
      padding: 0;
      display: grid;
      place-items: center;
      font-size: 18px;
      line-height: 1;
    }

    @media (max-width: 1040px) {
      .topbar { grid-template-columns: 1fr; }
      .status { justify-self: start; }
      .workspace { grid-template-columns: 1fr; height: auto; }
      .graph { height: 68vh; min-height: 500px; }
      .inspector { min-height: 220px; }
    }

    @media (max-width: 640px) {
      .app-shell { width: calc(100% - 20px); margin: 10px auto; }
      .query-bar { grid-template-columns: auto minmax(0, 1fr) auto; }
      #explainButton { display: none; }
      .cols { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><img src="/logo.png" alt="nautylus"></div>
      <div class="query-bar" role="search">
        <span class="query-prompt">$</span>
        <textarea id="query" rows="1" spellcheck="false">MATCH (n) RETURN n LIMIT 20</textarea>
        <button id="runButton" class="primary" type="button" onclick="runQuery()">Run</button>
        <button id="explainButton" type="button" onclick="explain()">Explain</button>
      </div>
      <span class="status" id="message">Ready</span>
      <button id="themeToggle" class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Switch to dark mode" title="Switch to dark mode">☾</button>
    </header>

    <section class="workspace">
      <div id="graph" class="graph" aria-label="Interactive graph visualization">
        <div class="graph-toolbar">
          <button type="button" onclick="fitGraph()">Fit graph</button>
          <button type="button" onclick="refreshAll()">Refresh</button>
        </div>
      </div>
      <aside id="inspector" class="inspector">
        <div class="inspector-empty">
          <h2>Inspector</h2>
          <p>Click a node or relationship to inspect it.</p>
          <p class="hint">Drag a node to pin it. Click a pinned node to release it. Double-click a node to expand neighbors.</p>
        </div>
      </aside>
    </section>

    <section class="details">
      <div class="panel">
        <h2>Output</h2>
        <pre id="output"></pre>
      </div>
    </section>
  </main>

  <script src="/d3.js"></script>
  <script>
    const NODE_RADIUS = 34;
    const PARALLEL_GAP = 30;
    const SELF_LOOP_RADIUS = 42;

    const graphHost = document.getElementById('graph');
    const inspector = document.getElementById('inspector');
    const themeToggle = document.getElementById('themeToggle');

    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      const dark = theme === 'dark';
      themeToggle.textContent = dark ? '☀' : '☾';
      themeToggle.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
      themeToggle.title = dark ? 'Switch to light mode' : 'Switch to dark mode';
      localStorage.setItem('nautylus-theme', theme);
      d3.select('#arrow path').attr('fill', 'var(--relationship)');
      d3.select('#arrow-selected path').attr('fill', 'var(--relationship-selected)');
    }

    function toggleTheme() {
      setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    }

    setTheme(localStorage.getItem('nautylus-theme') === 'dark' ? 'dark' : 'light');

    let fullGraph = { nodes: [], links: [] };
    let visibleIds = new Set();
    let nodePositions = new Map();
    let nodeColors = new Map(JSON.parse(localStorage.getItem('nautylus-node-colors') || '[]'));
    let nodeSpecificColors = new Map(JSON.parse(localStorage.getItem('nautylus-node-specific-colors') || '[]'));
    let nodes = [];
    let relationships = [];
    let selected = null;
    let physicsPaused = false;
    let expansionCount = 0;

    const svg = d3.select(graphHost).append('svg')
      .attr('role', 'img')
      .attr('aria-label', 'Interactive force-directed graph');

    const defs = svg.append('defs');
    defs.append('marker')
      .attr('id', 'arrow')
      .attr('viewBox', '0 -5 10 10')
      .attr('refX', 8)
      .attr('refY', 0)
      .attr('markerWidth', 6)
      .attr('markerHeight', 6)
      .attr('orient', 'auto')
      .attr('markerUnits', 'strokeWidth')
      .append('path')
      .attr('d', 'M0,-5L10,0L0,5')
      .attr('fill', 'var(--relationship)');

    defs.append('marker')
      .attr('id', 'arrow-selected')
      .attr('viewBox', '0 -5 10 10')
      .attr('refX', 8)
      .attr('refY', 0)
      .attr('markerWidth', 6)
      .attr('markerHeight', 6)
      .attr('orient', 'auto')
      .attr('markerUnits', 'strokeWidth')
      .append('path')
      .attr('d', 'M0,-5L10,0L0,5')
      .attr('fill', 'var(--relationship-selected)');

    const viewport = svg.append('g').attr('class', 'viewport');
    const relationshipLayer = viewport.append('g').attr('class', 'relationships');
    const nodeLayer = viewport.append('g').attr('class', 'nodes');

    const zoom = d3.zoom()
      .scaleExtent([0.2, 4])
      .on('zoom', event => viewport.attr('transform', event.transform));

    svg.call(zoom).on('dblclick.zoom', null);
    svg.on('click', event => {
      if (event.target === svg.node()) clearSelection();
    });

    const simulation = d3.forceSimulation()
      .force('link', d3.forceLink().id(d => d.id).distance(165).strength(.35))
      .force('charge', d3.forceManyBody().strength(-650))
      .force('collide', d3.forceCollide().radius(NODE_RADIUS + 20).iterations(2))
      .force('x', d3.forceX().strength(.035))
      .force('y', d3.forceY().strength(.035))
      .on('tick', ticked);

    let relationshipSelection = relationshipLayer.selectAll('g.relationship');
    let nodeSelection = nodeLayer.selectAll('g.node');

    async function req(path, body) {
      const opt = body === undefined ? {} : { method: 'POST', body };
      const response = await fetch(path, opt);
      const text = await response.text();
      if (!response.ok) throw new Error(text || response.statusText);
      return text;
    }

    function show(text) {
      document.getElementById('output').textContent = text;
      document.getElementById('message').textContent = 'Updated';
    }

    async function refreshAll() {
      try {
        document.getElementById('message').textContent = 'Refreshing';
        await drawGraph();
        document.getElementById('message').textContent = `${fullGraph.nodes.length} nodes, ${fullGraph.links.length} relationships`;
      } catch (error) {
        document.getElementById('message').textContent = error.message;
      }
    }

    function linkId(value) {
      return typeof value === 'object' ? value.id : value;
    }

    function seedVisibleIds() {
      const adjacency = new Map(fullGraph.nodes.map(node => [node.id, []]));
      for (const link of fullGraph.links) {
        const source = linkId(link.source);
        const target = linkId(link.target);
        if (adjacency.has(source)) adjacency.get(source).push(target);
        if (adjacency.has(target)) adjacency.get(target).push(source);
      }
      const seen = new Set();
      for (const node of fullGraph.nodes) {
        if (seen.has(node.id)) continue;
        const queue = [node.id];
        const component = [];
        let hasVisibleNode = false;
        seen.add(node.id);
        while (queue.length) {
          const current = queue.shift();
          component.push(current);
          if (visibleIds.has(current)) hasVisibleNode = true;
          for (const next of adjacency.get(current) || []) {
            if (!seen.has(next)) {
              seen.add(next);
              queue.push(next);
            }
          }
        }
        if (!hasVisibleNode && component.length) {
          visibleIds.add(component[0]);
          for (const next of adjacency.get(component[0]) || []) visibleIds.add(next);
        }
      }
    }

    async function drawGraph(seed = true, render = true) {
      fullGraph = JSON.parse(await req('/api/graph'));
      const validIds = new Set(fullGraph.nodes.map(d => d.id));
      visibleIds = new Set([...visibleIds].filter(id => validIds.has(id)));
      nodePositions = new Map([...nodePositions].filter(([id]) => validIds.has(id)));
      if (seed) seedVisibleIds();
      if (render) renderGraph();
    }

    function renderGraph() {
      nodes = fullGraph.nodes
        .filter(d => visibleIds.has(d.id))
        .map((d, index) => {
          const position = nodePositions.get(d.id);
          const label = d.label || 'Node';
          return {
            id: d.id,
            labels: label.split(',').filter(Boolean),
            properties: { id: d.id, caption: d.caption || d.id, label, ...(d.properties || {}) },
            x: position?.x,
            y: position?.y,
            _index: index
          };
        });

      relationships = fullGraph.links
        .filter(d => visibleIds.has(linkId(d.source)) && visibleIds.has(linkId(d.target)))
        .map((d, index) => {
          const source = linkId(d.source);
          const target = linkId(d.target);
          return {
            id: d.id || `${source}:${d.type}:${target}:${index}`,
            type: d.type || 'RELATED',
            startNode: source,
            endNode: target,
            source,
            target,
            properties: { source, target, type: d.type || 'RELATED' }
          };
        });

      if (!nodes.length) {
        relationshipLayer.selectAll('*').remove();
        nodeLayer.selectAll('*').remove();
        simulation.stop();
        inspector.innerHTML = '<div class="inspector-empty"><h2>Inspector</h2><p class="hint">No graph data.</p></div>';
        return;
      }

      const width = graphHost.clientWidth || 900;
      const height = graphHost.clientHeight || 650;
      nodes.forEach((d, index) => {
        if (Number.isFinite(d.x) && Number.isFinite(d.y)) return;
        const angle = (index / Math.max(1, nodes.length)) * Math.PI * 2;
        d.x = width / 2 + Math.cos(angle) * 170;
        d.y = height / 2 + Math.sin(angle) * 140;
      });

      updateGraph(true);
      refreshSelectionStyles();
      setTimeout(() => fitGraph(500), 350);
    }

    function prepareRelationships() {
      relationships.forEach(rel => {
        rel.source = typeof rel.source === 'object' ? rel.source.id : (rel.source ?? rel.startNode);
        rel.target = typeof rel.target === 'object' ? rel.target.id : (rel.target ?? rel.endNode);
      });

      const groups = d3.group(relationships, rel => [rel.source, rel.target].sort().join('::'));
      groups.forEach(group => {
        if (group.length === 1) {
          group[0]._curveSlot = 0;
          group[0]._parallelCount = 1;
          return;
        }

        const canonicalA = [group[0].source, group[0].target].sort()[0];
        const forward = group.filter(rel => rel.source === canonicalA && rel.source !== rel.target);
        const backward = group.filter(rel => rel.target === canonicalA && rel.source !== rel.target);
        const loops = group.filter(rel => rel.source === rel.target);
        const slots = symmetricSlots(group.length);
        let slotIndex = 0;
        const positive = slots.filter(v => v > 0);
        const negative = slots.filter(v => v < 0);
        const zero = slots.filter(v => v === 0);

        forward.forEach((rel, i) => rel._curveSlot = positive[i] ?? zero.shift() ?? negative.shift() ?? slots[slotIndex++]);
        backward.forEach((rel, i) => rel._curveSlot = negative[i] ?? zero.shift() ?? positive.shift() ?? slots[slotIndex++]);
        loops.forEach((rel, i) => rel._curveSlot = i + 1);

        const used = new Set();
        group.forEach((rel, i) => {
          if (used.has(rel._curveSlot) || rel._curveSlot === undefined) {
            rel._curveSlot = slots.find(slot => !used.has(slot)) ?? i + 1;
          }
          used.add(rel._curveSlot);
          rel._parallelCount = group.length;
        });
      });
    }

    function symmetricSlots(count) {
      if (count <= 1) return [0];
      const slots = [];
      if (count % 2 === 1) slots.push(0);
      for (let i = 1; slots.length < count; i += 1) {
        slots.push(i);
        if (slots.length < count) slots.push(-i);
      }
      return slots;
    }

    function updateGraph(reheat = true) {
      prepareRelationships();

      relationshipSelection = relationshipLayer
        .selectAll('g.relationship')
        .data(relationships, d => d.id)
        .join(
          enter => {
            const g = enter.append('g')
              .attr('class', 'relationship')
              .on('click', (event, d) => {
                event.stopPropagation();
                selectRelationship(d);
              })
              .on('mouseenter', (_, d) => highlightNeighborhood(d))
              .on('mouseleave', clearHighlight);

            g.append('path').attr('class', 'relationship-hit');
            g.append('path').attr('class', 'relationship-path').attr('marker-end', 'url(#arrow)');
            g.append('rect').attr('class', 'relationship-label-bg');
            g.append('text').attr('class', 'relationship-label').text(d => d.type);
            return g;
          },
          update => {
            update.select('.relationship-label').text(d => d.type);
            return update;
          },
          exit => exit.remove()
        );

      nodeSelection = nodeLayer
        .selectAll('g.node')
        .data(nodes, d => d.id)
        .join(
          enter => {
            const g = enter.append('g')
              .attr('class', 'node')
              .call(nodeDrag())
              .on('click', (event, d) => {
                event.stopPropagation();
                if (event.defaultPrevented) return;
                if (d.fx != null && d._wasDragged !== true) {
                  d.fx = null;
                  d.fy = null;
                  d3.select(event.currentTarget).select('.pin-dot').attr('visibility', 'hidden');
                  if (!physicsPaused) simulation.alpha(.45).restart();
                }
                d._wasDragged = false;
                selectNode(d);
              })
              .on('dblclick', (event, d) => {
                event.stopPropagation();
                expandNode(d);
              })
              .on('mouseenter', (_, d) => highlightNeighborhood(d))
              .on('mouseleave', clearHighlight);

            g.append('circle').attr('class', 'node-ring').attr('r', NODE_RADIUS + 5);
            g.append('circle')
              .attr('class', 'node-circle')
              .attr('r', NODE_RADIUS)
              .attr('fill', d => colorFor(d).fill)
              .attr('stroke', d => colorFor(d).stroke);
            g.append('text').attr('class', 'node-label').attr('y', -3).text(d => ellipsis(nodeTitle(d), 12));
            g.append('text').attr('class', 'node-sublabel').attr('y', 13).text(d => d.labels?.[0] ?? 'Node');
            g.append('circle').attr('class', 'pin-dot').attr('r', 5).attr('cx', NODE_RADIUS - 4).attr('cy', -(NODE_RADIUS - 4)).attr('visibility', 'hidden');
            return g;
          },
          update => {
            update.select('.node-circle')
              .attr('fill', d => colorFor(d).fill)
              .attr('stroke', d => colorFor(d).stroke);
            update.select('.node-label').text(d => ellipsis(nodeTitle(d), 12));
            update.select('.node-sublabel').text(d => d.labels?.[0] ?? 'Node');
            return update;
          },
          exit => exit.remove()
        );

      simulation.nodes(nodes);
      simulation.force('link').links(relationships);

      if (reheat && !physicsPaused) simulation.alpha(.9).restart();
    }

    function nodeDrag() {
      let startX = 0;
      let startY = 0;
      return d3.drag()
        .on('start', (event, d) => {
          startX = event.x;
          startY = event.y;
          d._wasDragged = false;
          if (!event.active && !physicsPaused) simulation.alphaTarget(.25).restart();
          d.fx = d.x;
          d.fy = d.y;
        })
        .on('drag', (event, d) => {
          if (Math.hypot(event.x - startX, event.y - startY) > 3) d._wasDragged = true;
          d.fx = event.x;
          d.fy = event.y;
        })
        .on('end', (event, d) => {
          if (!event.active && !physicsPaused) simulation.alphaTarget(0);
          nodeSelection.filter(node => node.id === d.id).select('.pin-dot').attr('visibility', 'visible');
        });
    }

    function ticked() {
      nodeSelection.attr('transform', d => {
        nodePositions.set(d.id, { x: d.x, y: d.y });
        return `translate(${d.x},${d.y})`;
      });

      relationshipSelection.each(function(d) {
        const g = d3.select(this);
        const pathD = relationshipPath(d);
        g.select('.relationship-path').attr('d', pathD);
        g.select('.relationship-hit').attr('d', pathD);
        const pathNode = g.select('.relationship-path').node();
        if (!pathNode) return;
        const length = pathNode.getTotalLength();
        const midpoint = pathNode.getPointAtLength(length / 2);
        const label = g.select('.relationship-label').attr('x', midpoint.x).attr('y', midpoint.y);
        const width = Math.max(20, label.node().getComputedTextLength() + 10);
        g.select('.relationship-label-bg')
          .attr('x', midpoint.x - width / 2)
          .attr('y', midpoint.y - 8)
          .attr('width', width)
          .attr('height', 16);
      });
    }

    function relationshipPath(d) {
      const source = d.source;
      const target = d.target;

      if (source.id === target.id) {
        const x = source.x;
        const y = source.y;
        const loop = SELF_LOOP_RADIUS + Math.abs(d._curveSlot || 1) * 9;
        const startX = x + NODE_RADIUS * .55;
        const startY = y - NODE_RADIUS * .82;
        const endX = x - NODE_RADIUS * .55;
        const endY = y - NODE_RADIUS * .82;
        return `M${startX},${startY} C${x + loop},${y - loop * 1.55} ${x - loop},${y - loop * 1.55} ${endX},${endY}`;
      }

      const dx = target.x - source.x;
      const dy = target.y - source.y;
      const distance = Math.max(1, Math.hypot(dx, dy));
      const ux = dx / distance;
      const uy = dy / distance;
      const directionSign = String(source.id) <= String(target.id) ? 1 : -1;
      const nx = -uy * directionSign;
      const ny = ux * directionSign;
      const sx = source.x + ux * (NODE_RADIUS + 2);
      const sy = source.y + uy * (NODE_RADIUS + 2);
      const tx = target.x - ux * (NODE_RADIUS + 9);
      const ty = target.y - uy * (NODE_RADIUS + 9);
      const slot = d._curveSlot || 0;
      if (slot === 0) return `M${sx},${sy} L${tx},${ty}`;
      const bend = slot * PARALLEL_GAP;
      const mx = (sx + tx) / 2 + nx * bend;
      const my = (sy + ty) / 2 + ny * bend;
      return `M${sx},${sy} Q${mx},${my} ${tx},${ty}`;
    }

    function colorFor(d) {
      const label = d.labels?.[0] || 'Node';
      const fill = nodeSpecificColors.get(String(d.id)) || color(label);
      return { fill, stroke: shade(fill, -24) };
    }

    function color(label) {
      if (nodeColors.has(label)) return nodeColors.get(label);
      const palette = ['#68bdf6', '#6dce9e', '#fcea7e', '#f2baf6', '#ffc766', '#93c5fd', '#a5abb6'];
      let h = 0;
      for (const ch of label) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      return palette[h % palette.length];
    }

    function shade(hex, amount) {
      const value = parseInt(hex.slice(1), 16);
      const clamp = n => Math.max(0, Math.min(255, n));
      const r = clamp((value >> 16) + amount);
      const g = clamp(((value >> 8) & 255) + amount);
      const b = clamp((value & 255) + amount);
      return `#${((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1)}`;
    }

    function nodeTitle(d) {
      return d.properties?.caption ?? d.properties?.name ?? d.id;
    }

    function ellipsis(value, max) {
      const text = String(value);
      return text.length <= max ? text : `${text.slice(0, max - 1)}...`;
    }

    function selectNode(d) {
      const label = d.labels?.[0] || 'Node';
      const nodeColor = nodeSpecificColors.get(String(d.id)) || color(label);
      selected = { kind: 'node', id: d.id };
      refreshSelectionStyles();
      inspector.innerHTML = `
        <span class="badge">${escapeHtml(d.labels?.join(':') || 'Node')}</span>
        <h2>${escapeHtml(nodeTitle(d))}</h2>
        <p><strong>Node ID:</strong> ${escapeHtml(d.id)}</p>
        <h3>Color</h3>
        <div class="color-editor">
          <input id="inspectorColor" type="color" value="${escapeHtml(nodeColor)}" aria-label="Node color">
          <div class="row">
            <button type="button" onclick="applyInspectorColor()">Apply</button>
            <button type="button" onclick="resetInspectorColor()">Reset</button>
          </div>
        </div>
        <label class="check-row">
          <input id="applyLabelColor" type="checkbox">
          <span>Apply to all ${escapeHtml(label)} nodes</span>
        </label>
        <p class="hint">By default this color applies only to node ${escapeHtml(d.id)}.</p>
        <h3>Properties</h3>
        ${propertyTable(d.properties)}
      `;
    }

    function selectRelationship(d) {
      selected = { kind: 'relationship', id: d.id };
      refreshSelectionStyles();
      inspector.innerHTML = `
        <span class="badge">${escapeHtml(d.type)}</span>
        <h2>${escapeHtml(nodeTitle(d.source))} -> ${escapeHtml(nodeTitle(d.target))}</h2>
        <p><strong>Relationship ID:</strong> ${escapeHtml(d.id)}</p>
        <p><strong>Curve slot:</strong> ${escapeHtml(String(d._curveSlot ?? 0))}</p>
        <h3>Properties</h3>
        ${propertyTable(d.properties)}
      `;
    }

    function propertyTable(properties = {}) {
      const entries = Object.entries(properties);
      if (!entries.length) return '<p class="hint">No properties.</p>';
      return `<table class="property-table"><tbody>${entries.map(([key, value]) => `
        <tr><th>${escapeHtml(key)}</th><td>${escapeHtml(formatValue(value))}</td></tr>
      `).join('')}</tbody></table>`;
    }

    function formatValue(value) {
      return typeof value === 'string' ? value : JSON.stringify(value);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function clearSelection() {
      selected = null;
      refreshSelectionStyles();
      inspector.innerHTML = `
        <div class="inspector-empty">
          <h2>Inspector</h2>
          <p>Click a node or relationship to inspect it.</p>
          <p class="hint">Drag a node to pin it. Click a pinned node to release it. Double-click a node to expand neighbors.</p>
        </div>`;
    }

    function refreshSelectionStyles() {
      nodeSelection.classed('selected', d => selected?.kind === 'node' && selected.id === d.id);
      relationshipSelection
        .classed('selected', d => selected?.kind === 'relationship' && selected.id === d.id)
        .select('.relationship-path')
        .attr('marker-end', d => selected?.kind === 'relationship' && selected.id === d.id ? 'url(#arrow-selected)' : 'url(#arrow)');
    }

    let highlightTimer = 0;

    function highlightNeighborhood(subject) {
      window.clearTimeout(highlightTimer);
      highlightTimer = window.setTimeout(() => applyNeighborhoodHighlight(subject), 45);
    }

    function applyNeighborhoodHighlight(subject) {
      const nodeIds = new Set();
      const relationshipIds = new Set();
      if (subject.labels) {
        nodeIds.add(subject.id);
        relationships.forEach(rel => {
          const sourceId = typeof rel.source === 'object' ? rel.source.id : rel.source;
          const targetId = typeof rel.target === 'object' ? rel.target.id : rel.target;
          if (sourceId === subject.id || targetId === subject.id) {
            nodeIds.add(sourceId);
            nodeIds.add(targetId);
            relationshipIds.add(rel.id);
          }
        });
      } else {
        nodeIds.add(subject.source.id);
        nodeIds.add(subject.target.id);
        relationshipIds.add(subject.id);
      }
      nodeSelection.classed('dimmed', d => !nodeIds.has(d.id));
      relationshipSelection.classed('dimmed', d => !relationshipIds.has(d.id));
    }

    function clearHighlight() {
      window.clearTimeout(highlightTimer);
      highlightTimer = window.setTimeout(() => {
        nodeSelection.classed('dimmed', false);
        relationshipSelection.classed('dimmed', false);
      }, 70);
    }

    function expandNode(node) {
      const before = visibleIds.size;
      const origin = nodePositions.get(node.id) || node;
      const seedNeighbor = id => {
        if (nodePositions.has(id)) return;
        const angle = expansionCount * 2.399963229728653;
        const radius = 96 + (expansionCount % 3) * 22;
        expansionCount++;
        nodePositions.set(id, {
          x: (origin.x || 0) + Math.cos(angle) * radius,
          y: (origin.y || 0) + Math.sin(angle) * radius
        });
      };
      for (const link of fullGraph.links) {
        const source = linkId(link.source);
        const target = linkId(link.target);
        if (source === node.id) {
          visibleIds.add(target);
          seedNeighbor(target);
        }
        if (target === node.id) {
          visibleIds.add(source);
          seedNeighbor(source);
        }
      }
      document.getElementById('message').textContent = visibleIds.size > before ? 'Expanded' : 'No more neighbors';
      renderGraph();
    }

    function fitGraph(duration = 500) {
      if (!nodes.length) return;
      const bounds = viewport.node().getBBox();
      const width = graphHost.clientWidth;
      const height = graphHost.clientHeight;
      if (!bounds.width || !bounds.height || !width || !height) return;
      const padding = 80;
      const scale = Math.min(2.2, .92 / Math.max((bounds.width + padding) / width, (bounds.height + padding) / height));
      const x = width / 2 - scale * (bounds.x + bounds.width / 2);
      const y = height / 2 - scale * (bounds.y + bounds.height / 2);
      svg.transition().duration(duration).call(zoom.transform, d3.zoomIdentity.translate(x, y).scale(scale));
    }

    function resetLayout() {
      nodes.forEach(d => {
        d.fx = null;
        d.fy = null;
        d.x = NaN;
        d.y = NaN;
        d.vx = 0;
        d.vy = 0;
      });
      nodePositions.clear();
      nodeSelection.select('.pin-dot').attr('visibility', 'hidden');
      physicsPaused = false;
      simulation.alpha(1).restart();
      setTimeout(() => fitGraph(500), 350);
    }

    async function runQuery() {
      try {
        const query = document.getElementById('query').value;
        const output = await req('/api/query', query);
        show(output);
        await drawGraph(false, false);
        try {
          const ids = (await req('/api/query-nodes', query)).split(/\s+/).filter(Boolean);
          const validIds = new Set(fullGraph.nodes.map(d => d.id));
          visibleIds = new Set(ids.filter(id => validIds.has(id)));
        } catch (_) {
          visibleIds.clear();
          seedVisibleIds();
        }
        renderGraph();
      } catch (error) {
        show(error.message);
      }
    }

    async function explain() {
      try { show(await req('/api/explain', document.getElementById('query').value)); }
      catch (error) { show(error.message); }
    }

    async function sample() {
      try {
        show(await req('/api/sample', ''));
        visibleIds.clear();
        nodePositions.clear();
        expansionCount = 0;
        await refreshAll();
      } catch (error) {
        show(error.message);
      }
    }

    function saveNodeColors() {
      localStorage.setItem('nautylus-node-colors', JSON.stringify([...nodeColors]));
      localStorage.setItem('nautylus-node-specific-colors', JSON.stringify([...nodeSpecificColors]));
    }

    function selectedNode() {
      if (selected?.kind !== 'node') return null;
      return nodes.find(node => node.id === selected.id) || null;
    }

    function applyInspectorColor() {
      const node = selectedNode();
      const value = document.getElementById('inspectorColor')?.value;
      if (!node || !value) return;
      const label = node.labels?.[0] || 'Node';
      const applyToLabel = document.getElementById('applyLabelColor')?.checked;
      if (applyToLabel) {
        nodeColors.set(label, value);
        nodes.filter(candidate => (candidate.labels?.[0] || 'Node') === label)
          .forEach(candidate => nodeSpecificColors.delete(String(candidate.id)));
      } else {
        nodeSpecificColors.set(String(node.id), value);
      }
      saveNodeColors();
      updateGraph(false);
      refreshSelectionStyles();
      selectNode(node);
    }

    function resetInspectorColor() {
      const node = selectedNode();
      if (!node) return;
      const label = node.labels?.[0] || 'Node';
      const applyToLabel = document.getElementById('applyLabelColor')?.checked;
      if (applyToLabel)
        nodeColors.delete(label);
      else
        nodeSpecificColors.delete(String(node.id));
      saveNodeColors();
      updateGraph(false);
      refreshSelectionStyles();
      selectNode(node);
    }

    const queryInput = document.getElementById('query');

    function resizeQueryInput() {
      queryInput.style.height = '34px';
      queryInput.style.height = `${Math.min(queryInput.scrollHeight, 140)}px`;
    }

    queryInput.addEventListener('input', resizeQueryInput);
    queryInput.addEventListener('keydown', event => {
      if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') runQuery();
    });
    resizeQueryInput();

    const resizeObserver = new ResizeObserver(() => {
      const width = graphHost.clientWidth;
      const height = graphHost.clientHeight;
      simulation.force('x', d3.forceX(width / 2).strength(.035));
      simulation.force('y', d3.forceY(height / 2).strength(.035));
      if (!physicsPaused) simulation.alpha(.12).restart();
    });
    resizeObserver.observe(graphHost);

    refreshAll();
  </script>
</body>
</html>
